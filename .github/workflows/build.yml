name: Build AnnyOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld make gdisk dosfstools mtools python3

      - name: Build UEFI image and drivers
        run: make build

      - name: Package SDK source
        run: python3 tools/package_sdk.py build/AnnyOS-SDK.zip

      - name: Package AP sample applications
        run: |
          mkdir -p build/esp/APPS
          for source in apps/*.apasm; do
            name="$(basename "${source%.apasm}")"
            python3 tools/ap_pack.py "$source" "build/esp/APPS/${name}.AP"
          done

      - name: Create GPT and FAT32 UEFI disk image
        run: |
          image=build/AnnyOS.img
          truncate -s 64M "$image"
          sgdisk --clear --new=1:2048:0 --typecode=1:EF00 --change-name=1:AnnyOS "$image"
          mformat -i "$image@@1048576" -F -v ANNYOS ::
          mmd -i "$image@@1048576" ::/EFI
          mmd -i "$image@@1048576" ::/EFI/BOOT
          mmd -i "$image@@1048576" ::/driver
          mmd -i "$image@@1048576" ::/fonts
          mmd -i "$image@@1048576" ::/fonts/segoe-ui
          mmd -i "$image@@1048576" ::/APPS
          mcopy -i "$image@@1048576" build/esp/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/
          mcopy -i "$image@@1048576" build/esp/ANNYOS.BIN build/esp/bootx86.efi ::/
          mcopy -i "$image@@1048576" build/esp/driver/*.sys ::/driver/
          mcopy -i "$image@@1048576" build/esp/fonts/segoe-ui/* ::/fonts/segoe-ui/
          mcopy -i "$image@@1048576" build/esp/APPS/*.AP ::/APPS/
          mdir -i "$image@@1048576" ::/

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: AnnyOS-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/AnnyOS.img
            build/AnnyOS-SDK.zip
