name: Build AnnyOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld make python3

      - name: Build UEFI image, drivers, and FAT32 disk
        run: make build

      - name: Package SDK source
        run: python3 tools/package_sdk.py build/AnnyOS-SDK.zip

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: AnnyOS-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/AnnyOS.img
            build/AnnyOS-SDK.zip
