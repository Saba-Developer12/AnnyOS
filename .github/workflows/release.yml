name: Release AnnyOS and SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag whose release assets should be rebuilt
        required: true
        default: v0.4.5

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld make python3

      - name: Build AnnyOS and FAT32 disk image
        run: make build

      - name: Package AnnyOS SDK
        run: python3 tools/package_sdk.py build/AnnyOS-SDK.zip

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            build/AnnyOS.img
            build/AnnyOS-SDK.zip
          overwrite_files: true
          generate_release_notes: true
